[tool.poetry]
name = "aegis-guard"
version = "0.1.0"
description = "Local-first PII redaction gateway before cloud LLMs"
authors = ["Aegis-Guard Team"]
readme = "README.md"
packages = [
    { include = "backend" },
    { include = "shared" },
]

[tool.poetry.dependencies]
python = "^3.11"

# Backend
fastapi = "^0.111.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"

# Scrubbing Pipeline
presidio-analyzer = "^2.2.355"
presidio-anonymizer = "^2.2.355"
spacy = "^3.7.4"

# Vault & Encryption
sqlalchemy = { version = "^2.0.30", extras = ["asyncio"] }
aiosqlite = "^0.20.0"
alembic = "^1.13.1"
cryptography = "^42.0.8"   # AES-256-GCM
argon2-cffi = "^23.1.0"    # KDF for passphrase-gated restore

# Security & Middleware
slowapi = "^0.1.9"          # Local rate limiting
python-multipart = "^0.0.9"

# Utilities
httpx = "^0.27.0"
python-dotenv = "^1.0.1"

# OCR Pipeline (Aegis-Vision)
easyocr = "^1.7.1"          # English OCR engine; downloads model weights on first use
pdf2image = "^1.17.0"       # PDF-to-PIL via Poppler (must install Poppler separately)
pillow = "^10.3.0"          # PIL/Image used by both vision.py and pdf2image
numpy = "^1.26.0"           # Required by easyocr for ndarray input

# Frontend
streamlit = "^1.35.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
ruff = "^0.4.7"
mypy = "^1.10.0"
httpx = "^0.27.0"  # For TestClient

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
